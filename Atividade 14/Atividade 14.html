<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Conversor de Caixa - Maiúsculas/Minúsculas</title>
</head>
<body>
    <h2>Conversor de Maiúsculas/Minúsculas</h2>

    <label for="textInput">Digite o texto:</label>
    <input type="text" id="textInput" placeholder="Exemplo: Olá Mundo!">

    <br><br>

    <label>
        <input type="radio" name="caseOption" value="upper" id="radioUpper">
        Converter para MAIÚSCULAS
    </label>
    <br>
    <label>
        <input type="radio" name="caseOption" value="lower" id="radioLower">
        Converter para minúsculas
    </label>

    <br><br>

    <button id="convertBtn">Aplicar Conversão</button>

    <script>
        const textInput = document.getElementById('textInput');
        const radioUpper = document.getElementById('radioUpper');
        const radioLower = document.getElementById('radioLower');
        const convertBtn = document.getElementById('convertBtn');

        function transformText() {
            if (radioUpper.checked) {
                textInput.value = textInput.value.toUpperCase();
            } else if (radioLower.checked) {
                textInput.value = textInput.value.toLowerCase();
            } else {
                alert('Por favor, selecione uma opção (Maiúsculas ou Minúsculas)');
            }
        }

        convertBtn.addEventListener('click', transformText);
    </script>
</body>
</html>
