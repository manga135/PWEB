<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formas de criar objetos</title>
</head>

<body>
    <script>
        var aluno1 = new Object();
        aluno1.nome = "Eduardo";
        aluno1.ra = "123456";
        alert("Aluno 1: " + aluno1.nome + " - RA: " + aluno1.ra);

        var aluno2 = {}
        aluno2.ra = "1234"
        aluno2["nome"] = "Gabriel";
        alert("Aluno 2: " + aluno2.nome + " - RA: " + aluno2.ra);

        aluno2["email do aluno"] = "gabriel@gmail.com";
        alert("Aluno 2: " + aluno2.nome + " - RA: " + aluno2.ra + " - Email: " + aluno2["email do aluno"]);

        aluno3 = {
            ra: "12345",
            nome: "José",
        }

        alert("Aluno 3: " + aluno3.nome + " - RA: " + aluno3.ra);

        function aluno(ra, nome) {
            this.ra = ra;
            this.nome = nome;
            this.MostraDados = function() {
                alert("Aluno: " + this.nome + " - RA: " + this.ra);
            }
        }

        var aluno4 = new aluno("1234567", "Jamilly");
        alert(aluno4.MostraDados());
        alert(aluno4.nome);

        function Aluno2(){
            var ra;
            var nome;
            this.setRa = function(value) {
                this.ra = value;
            }
            this.getRa = function(){
                return this.ra;
            }
             this.setNome = function(value) {
                this.nome = value;
            }
            this.getNome = function(){
                return this.nome;
            }
        }
        var aluno6 = new Aluno2();
        aluno6.setNome("Lana");
        aluno6.setRa("234");
        alert("ra=" + aluno6.getRa() + " nome =" + aluno6.getNome());

        function AlunoADS() {
            var numLab;
             this.setnumLab = function(value) {
                this.numLab = value;
            }
            this.getnumLab = function(){
                return this.numLab;
            }
        }

        AlunoADS.prototype = new Aluno2();
        var aluno7 = new AlunoADS();
        aluno7.setNome("Mirella");
        aluno7.setRa("123");
        aluno7.setnumLab(5);
        alert(aluno7.getNome() + " " + aluno7.getnumLab());

        class Aluno1 {
            constructor(){
                this._ra;
                this._nome;
            }
            setNome(value){
                this._nome = value;
            }
            getNome(){
                return this._nome;
            }
            setRa(value) {
                this._ra = value;
            }
            getRa() {
                return this._ra;
            }
        }
        var objAluno = new Aluno1();
        objAluno.setNome("Caroline");
        objAluno.setRa('67');
        alert(`nome=${objAluno.getNome()} ra=${objAluno.getRa()}`);

        class AlunoADS1 extends Aluno1 {
            constructor() {
                super();
                this.numLab;
            }
            setnumLab = function(value) {
                this.numLab = value;
            }
            getnumLab = function(){
                return this.numLab;
            }
        }
        var objAlunoADS = new AlunoADS1();
        objAlunoADS.setNome("Otávio");
        objAlunoADS.setRa("123");
        objAlunoADS.setnumLab(6);
        alert(`nome=${objAlunoADS.getNome()} ra=${objAlunoADS.getRa()} numLab=${objAlunoADS.getnumLab()}`);

        var obj1 = new Object();
        var obj2 = obj1;
        obj1.nome = "Camila";
        alert(obj2.nome);

        class ContaBancaria {
            #cpf;

            constructor(nome, saldoInicial) {
                this.nome = nome;
                this.saldo = saldoInicial;
            }

            setCpf(value) {
                this.cpf = value;
            }
            getCpf = function(){
                return this.cpf;
            }
            setSaldo = function(value) {
                this.saldo = value;
            }
            getSaldo = function(){
                return this.saldo;
            }

            depositar(valor) {
                this.saldo += valor;
                this.#registrarTransacao(valor);
            }

            #registrarTransacao(valor) {
                console.log(`Depósito de R$ ${valor} realizado pelo ${this.nome} e o Saldo R$ ${this.saldo} para cpf ${this.getCpf()} ou ${this.#cpf}`);
            }
        }

        const conta = new ContaBancaria("Gustavo", 1000);
        conta.setCpf(123);
        conta.depositar(500);

        const arr = [
            ['codigo', 1],
            ['nome', "João"],
            ['idade', 23]
        ];
        const obj = new Object.fromEntries(arr);
        alert(obj);
        alert(obj.nome);
        alert(JSON.stringify(obj));

        const objEmpresa = {
            empresa: 'ZF do Brasil'
        };
        const funcionario = Object.create(objEmpresa, {
            nome: {
                value: 'Jorge'
            },
            endereco: {
                value: 'Av. Sao Paulo'
            },
        });
        console.log(funcionario.empresa);
        console.log(funcionario.nome);

        const objNovaEmpresa = {
            empresa: 'ZF do Brasil'
        };
        const objVeiculo = {
            placa: 'XXX 1234'
        };

        const motorista = Object.assign({
            cpf: "123"
        }, objNovaEmpresa, objVeiculo);
        console.log(motorista);
    </script>
</body>
</html>
